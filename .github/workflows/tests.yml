name: Tests

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:

permissions:
  contents: read

# Group runs by workflow and PR/ref; release-triggered runs use a separate
# `-release` suffix. Cancel an older run when a new one uses the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'release' && '-release' || '' }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - run: shellcheck ./src/*
  build:
    strategy:
      matrix:
        os: ['macos-15', 'ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - run: ./script/install-bats.sh
      shell: bash

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        repository: bats-core/bats-support
        path: bats-support

    # set PATH to ensure we use bats from our local installation (looking at you Mac Runner!)
    - name: bats test
      shell: bash
      run: |
        PATH="$HOME/.local/bin:$PATH"
        bats -v
        BATS_LIB_PATH="$PWD" bats --print-output-on-failure test
