name: Tests

on:
  workflow_call:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:

permissions:
  contents: read

# Group runs by workflow and PR/ref; release-triggered runs use a separate
# `-release` suffix. Cancel an older run when a new one uses the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'release' && '-release' || '' }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: shellcheck ./src/*

  build:
    strategy:
      matrix:
        os: ['macos-15', 'ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: ./script/install-bats.sh
      shell: bash

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: bats-core/bats-support
        path: bats-support

    # set PATH to ensure we use bats from our local installation (looking at you Mac Runner!)
    - name: bats test
      shell: bash
      run: |
        PATH="$HOME/.local/bin:$PATH"
        bats -v
        BATS_LIB_PATH="$PWD" bats --print-output-on-failure test

  super-linter:
    name: Run Super-Linter
    uses: bats-hardened/.github/.github/workflows/super-linter.yml@44fd251ecb1b4ca6fd2537eaa65be75b9be0395d # v1.1.1-beta01
    permissions:
      contents: read
